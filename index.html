<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Drop Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-banner">
        <img id="hori-logo" src="./img/cw_logo-horizontal.png" alt="charity: water">
    </header>
    <div class="game-wrapper">
        <h1 class="game-title">Water Drop</h1>
        <p class="game-tagline">Catch the good drops, avoid the bad ones. Catch smaller drops for double points!</p>
        <div class="dif-options">
          <button class="dif-btn" id="easy-btn">Easy</button>
          <button class="dif-btn" id="med-btn">Medium</button>
          <button class="dif-btn" id="hard-btn">Hard</button>
          <p class="dif-indicator">Current Difficulty: <span id="dif">Medium</span></p>
        </div>
        <div class="score-panel">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="timer">Time: <span id="time">30</span>s</div>
            <button id="start-btn">Start Game</button>
            <button id="reset-btn">Reset</button>
        </div>
        
        <div id="game-container">
        </div>
    </div>

    <footer>
      <a href="https://www.charitywater.org/" target="_blank">Visit charity: water</a><span>|</span><a href="https://www.charitywater.org/donate" target="_blank">Donate Today</a>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
